spring.application.name=clube_da_ultima_pagina

spring.datasource.url=jdbc:h2:file:./data/exemplo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=clubedolivro
spring.datasource.password=password

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Mantém os dados entre reinicializações - atualiza schema quando necessário
spring.jpa.hibernate.ddl-auto=update
# Mostra as queries SQL no console (opcional - para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração para garantir que o H2 não feche a conexão automaticamente
spring.datasource.hikari.maximum-pool-size=1

# Configuração para tratamento de erros
server.error.whitelabel.enabled=false

# Habilita ProblemDetail para APIs REST (RFC 7807)
spring.mvc.problemdetails.enabled=true
